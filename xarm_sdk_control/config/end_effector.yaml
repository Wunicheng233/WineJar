name: dual_vacuum_cup_v3
type: dual_vacuum_cup
cup_count: 2

# Tool frame is centered between the two cups and aligned with the flange axis.
# 2026-10-13: user measured flange mounting face to uncompressed cup contact plane.
# Nominal measurement; contact verification is still pending.
tcp_offset_mm_deg: [0.0, 0.0, 116.0, 0.0, 0.0, 0.0]

# Historical reset pose taught with TCP Z=113 mm in the previous layout.
# NOT revalidated after base relocation and TCP update; re-teach before motion.
home_pose_mm_deg: [215.194, -2.409, 300.000, 178.467, 0.581, -0.014]

vacuum_io:
  pump_channel: 0
  valve_channel: 1
  pump_on_value: 1
  valve_vacuum_value: 1

# Measured spring travel and initial conservative working compression.
max_compression_mm: 20.0
default_compression_mm: 13.0

# ZSE30A-01-N vacuum pressure switch on CI0 (NPN). Hardware-verified polarity:
# CI0 = 0 means vacuum reached the threshold (suction achieved).
suction_sensor:
  input_channel: 0
  success_value: 0
  debounce_seconds: 0.05
  timeout_seconds: 2.0
